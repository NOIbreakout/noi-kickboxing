<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030b19"><title>NOI KICKBOXING</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#123b66,#030914 70%);color:white;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;text-align:center}main{max-width:520px;margin:auto;padding:22px 16px 32px}.brand{letter-spacing:.24em;color:#63dfff;font-size:12px}h1{font-size:36px;margin:5px 0 0;text-shadow:0 0 22px #00bfff}.sub{font-size:12px;letter-spacing:.18em;color:#b6d3e5}.stats{display:flex;justify-content:space-around;margin:24px 0 10px}.stats strong{display:block;font-size:30px}.stats span{font-size:11px;color:#a6c9db}.arena{height:310px;border:1px solid #268ab9;border-radius:24px;background:radial-gradient(ellipse at 50% 40%,#1c5d85 0%,#07182b 62%,#020813 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 65px #008eff30,0 0 25px #008eff22}.arena:before{content:"";position:absolute;left:-20%;right:-20%;bottom:35px;height:2px;background:#14bbff;box-shadow:0 -45px #1686b5,0 -90px #125879;opacity:.55}.fighter{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font-size:148px;filter:drop-shadow(0 0 24px #21b6ff);transition:transform .13s}.fighter.hit{transform:translate(-50%,-50%) rotate(12deg) scale(.92)}.tag{position:absolute;top:12px;left:0;right:0;font-size:11px;letter-spacing:.2em;color:#8cdefe}.hitflash{position:absolute;inset:0;background:#8deaff;opacity:0;pointer-events:none}.hitflash.active{opacity:.3}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}button{border:1px solid #3fcbff;border-radius:16px;padding:14px 6px;color:#fff;font-weight:800;background:linear-gradient(135deg,#006aa5,#073051);font-size:14px;box-shadow:0 0 14px #00aeff33}button:disabled{opacity:.4}button.secondary{background:#142438;font-size:14px}.wide{width:100%;margin-top:8px}.status{min-height:27px;color:#8fe6ff;font-weight:700}.footer{font-size:11px;color:#8ba7b7;margin-top:15px}.result{display:none;background:#071c31;border:1px solid #26c8ff;border-radius:18px;padding:16px;margin-top:15px}.result.show{display:block}.result strong{font-size:32px;color:#75e7ff}</style></head><body><main><div class="brand">NOI ENERGY BREAKOUT</div><h1>NOI KICKBOXING</h1><div class="sub">BLUE NEON BATTLE · PROTOTYPE 0.2</div><div class="stats"><div><strong id="timer">30</strong><span>SECONDS</span></div><div><strong id="score">0</strong><span>SCORE</span></div><div><strong id="combo">0</strong><span>COMBO</span></div></div><div class="arena" aria-label="キックボクシングアリーナ"><div class="tag">ROUND 1 / THE CHALLENGER</div><div id="fighter" class="fighter" aria-hidden="true">🥊</div><div id="flash" class="hitflash"></div></div><p class="status" id="status">STARTを押して対戦開始！</p><div class="controls"><button id="jab" disabled>👊 JAB +10</button><button id="cross" disabled>💥 CROSS +20</button><button id="low" disabled>🦵 LOW KICK +15</button><button id="middle" disabled>⚡ MIDDLE +25</button><button id="high" disabled>🔥 HIGH KICK +35</button><button id="hook" disabled>🥊 HOOK +20</button></div><button id="start" class="wide">▶ START / 30秒対戦</button><section id="result" class="result"><div>YOUR FINAL SCORE</div><strong id="final">0</strong><p id="best"></p><button id="share" class="wide secondary">結果を共有する</button></section><p class="footer">NOI ENERGY BREAKOUT © 2026 · iPhone / Android</p></main><script>let time=30,score=0,combo=0,active=false,interval=null,ctx;const $=id=>document.getElementById(id);function sound(freq){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(65,ctx.currentTime+.13);g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.15)}catch(e){}}function render(){$('timer').textContent=time;$('score').textContent=score;$('combo').textContent=combo}function punch(points,label){if(!active)return;combo++;score+=points+Math.min(combo,20);render();sound(points>=25?110:points===10?220:145);$('fighter').classList.add('hit');$('flash').classList.add('active');$('status').textContent=combo>=5?`🔥 ${combo} COMBO!`:`${label} HIT!`;setTimeout(()=>{$('fighter').classList.remove('hit');$('flash').classList.remove('active')},110)}function finish(){active=false;clearInterval(interval);['jab','cross','hook','low','middle','high'].forEach(id=>$(id).disabled=true);$('start').disabled=false;$('start').textContent='↻ もう一度挑戦';$('final').textContent=score;let best=Math.max(score,Number(localStorage.getItem('noiBest')||0));localStorage.setItem('noiBest',best);$('best').textContent=`自己ベスト：${best}点`;$('result').classList.add('show');$('status').textContent='ROUND COMPLETE!'}$('start').onclick=()=>{clearInterval(interval);time=30;score=0;combo=0;active=true;render();$('result').classList.remove('show');['jab','cross','hook','low','middle','high'].forEach(id=>$(id).disabled=false);$('start').disabled=true;$('status').textContent='PUNCH & KICK!';interval=setInterval(()=>{time--;render();if(time<=0)finish()},1000)};[['jab',10,'JAB'],['cross',20,'CROSS'],['hook',20,'HOOK'],['low',15,'LOW KICK'],['middle',25,'MIDDLE KICK'],['high',35,'HIGH KICK']].forEach(([id,pts,label])=>$(id).onclick=()=>punch(pts,label));$('share').onclick=async()=>{let message=`NOI KICKBOXINGで${score}点獲得！🥊🦵⚡ #NOIKICKBOXING #NOIENERGYBREAKOUT`;try{if(navigator.share)await navigator.share({title:'NOI KICKBOXING',text:message,url:location.protocol.startsWith('http')?location.href:undefined});else{await navigator.clipboard.writeText(message);$('status').textContent='結果をコピーしました'}}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できませんでした'}};render();</script></body></html>
